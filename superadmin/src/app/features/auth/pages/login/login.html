<h2 class="card-title">Welcome back</h2>
<p class="card-sub">Sign in to your Energy Hub Superadmin console to continue.</p>

<form class="auth-form" [formGroup]="form" (ngSubmit)="onSubmit()" novalidate>
  <div class="form-field" [class.invalid]="showError('email')">
    <span class="field-icon">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="4" width="20" height="16" rx="3"/><path d="m2 7 10 6L22 7"/></svg>
    </span>
    <input type="email" formControlName="email" placeholder="Email address" autocomplete="email" />
    @if (showError('email')) {
      <div class="field-error">Enter a valid email address.</div>
    }
  </div>

  <div class="form-field" [class.invalid]="showError('password')">
    <span class="field-icon">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="10" width="16" height="11" rx="3"/><path d="M8 10V7a4 4 0 0 1 8 0v3"/></svg>
    </span>
    <input
      [type]="showPassword() ? 'text' : 'password'"
      formControlName="password"
      placeholder="Password"
      autocomplete="current-password"
    />
    <button type="button" class="eye-btn" (click)="showPassword.set(!showPassword())" aria-label="Toggle password">
      @if (showPassword()) {
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7-10-7-10-7Z"/><circle cx="12" cy="12" r="3"/></svg>
      } @else {
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9.9 4.24A9.12 9.12 0 0 1 12 4c6.5 0 10 8 10 8a13.16 13.16 0 0 1-1.67 2.68"/><path d="M6.61 6.61A13.53 13.53 0 0 0 2 12s3.5 8 10 8a9.74 9.74 0 0 0 5.39-1.61"/><line x1="2" y1="2" x2="22" y2="22"/></svg>
      }
    </button>
    @if (showError('password')) {
      <div class="field-error">Enter your password.</div>
    }
  </div>

  <div class="form-row">
    <a class="link" routerLink="/auth/forgot-password">Forgot password?</a>
  </div>

  @if (serverError()) {
    <div class="server-error">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg>
      {{ serverError() }}
    </div>
  }

  <button class="btn-primary" type="submit" [disabled]="loading()">
    @if (loading()) {
      <span class="spinner"></span> Signing in…
    } @else {
      Sign In
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14"/><path d="m13 6 6 6-6 6"/></svg>
    }
  </button>
</form>
